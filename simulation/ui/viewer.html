<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trireme run replay</title>
<style>
  :root { --ink:#2b2b2b; --mut:#777; --line:#ddd; --paper:#faf8f2; --ll:#0b7a6f; --hl:#c2600a; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font:14px/1.4 system-ui, sans-serif;
         background:var(--paper); color:var(--ink); }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px;
           border-bottom:1px solid var(--line); background:#fff; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  select, button { font:inherit; padding:4px 8px; border:1px solid var(--line);
                   border-radius:6px; background:#fff; }
  button { cursor:pointer; }
  #clock { font-variant-numeric:tabular-nums; color:var(--mut); }
  #meta { margin-left:auto; color:var(--mut); font-size:12px; max-width:46%; }
  main { flex:1; display:flex; min-height:0; }
  #mapwrap { flex:1; position:relative; min-width:0; }
  svg#map { position:absolute; inset:0; width:100%; height:100%; }
  svg text { font:11px system-ui, sans-serif; fill:var(--mut); }
  .gridline { stroke:#e8e4da; stroke-width:1; }
  .trace { fill:none; stroke-linejoin:round; stroke-linecap:round; }
  .trace.todo { stroke:#c9c4b8; stroke-dasharray:3 4; stroke-width:1.2; }
  .trace.ll  { stroke:var(--ll); stroke-width:2; }
  .trace.hl  { stroke:var(--hl); stroke-width:2; }
  .ship .hull { stroke:#fff; stroke-width:1; }
  .ship.ll .hull { fill:var(--ll); }
  .ship.hl .hull { fill:rgba(194,96,10,.22); stroke:var(--hl); stroke-width:2.2; }
  .ship .oar-line { stroke:#fff; stroke-width:1.1; }
  .ship.hl .oar-line { stroke-width:1.3; }
  .ship .steer-line { stroke:#fff; stroke-width:2.2; }
  .ship.hl .steer-line { stroke:var(--hl); stroke-width:2.6; }
  #legend { margin-top:6px; color:var(--mut); font-size:12px; }
  #legend b { color:var(--ink); font-weight:600; }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px;
        margin:0 2px 0 5px; vertical-align:-1px; }
  aside { width:250px; border-left:1px solid var(--line); background:#fff;
          padding:12px; overflow-y:auto; }
  aside h3 { font-size:12px; margin:0 0 6px; text-transform:uppercase;
             letter-spacing:.06em; color:var(--mut); }
  .sim { margin-bottom:14px; padding-bottom:10px; border-bottom:1px dashed var(--line); }
  .sim table { border-collapse:collapse; width:100%; font-size:13px; }
  .sim td { padding:2px 4px; }
  .sim td:first-child { color:var(--mut); }
  .sim .big { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .wbar { background:var(--line); height:8px; border-radius:4px; overflow:hidden; }
  .wbar i { display:block; height:100%; background:var(--ll); }
  .sim.hl .wbar i { background:var(--hl); }
  .tag { font-size:11px; color:#a33; font-weight:600; }
  footer { border-top:1px solid var(--line); background:#fff; padding:8px 16px 10px; }
  #cmdstrip { position:relative; height:26px; }
  .cmd { position:absolute; top:4px; width:3px; height:18px; border-radius:1px;
         background:#999; cursor:pointer; }
  .cmd:hover { transform:scaleX(2); }
  .cmd.active { background:#2b2b2b; }
  .cursor { position:absolute; top:0; bottom:0; width:2px; background:var(--ink);
            pointer-events:none; }
  #cmdbar { position:relative; height:2px; background:var(--line); margin:3px 0; }
</style>
</head>
<body>
<header>
  <h1>⚓ Trireme run replay</h1>
  <select id="run" title="computed run"></select>
  <label id="cmplbl" title="show the fast sim (HL) alongside the per-oar sim (LL)">
    <input type="checkbox" id="compare" checked> compare LL + HL</label>
  <button id="play" title="space">▶</button>
  <select id="speed">
    <option value="0.5">0.5×</option><option value="1" selected>1×</option>
    <option value="2">2×</option><option value="5">5×</option>
    <option value="10">10×</option><option value="20">20×</option>
    <option value="50">50×</option><option value="100">100×</option>
  </select>
  <span id="clock">0:00 / 0:00</span>
  <span id="meta"></span>
</header>
<main>
  <div id="mapwrap"><svg id="map"></svg></div>
  <aside id="readouts"></aside>
</main>
<footer>
  <div id="cmdbar"></div>
  <div id="cmdstrip"></div>
  <div id="legend">orders on the ships — <b>oar angle</b>: row (sweeping at the rate) ·
    hold (perpendicular) · back (blades forward) · bank (raised) —
    <b>oar colour</b>: <span class="sw" style="background:#9e9e9e"></span>rest
    <span class="sw" style="background:#43a047"></span>steady
    <span class="sw" style="background:#f9a825"></span>fast
    <span class="sw" style="background:#e53935"></span>spoude —
    <b>stern oar</b>: helm direction</div>
</footer>
<script>
"use strict";
/* Trireme run replay — reads the deterministic telemetry logs written by
   ui/dump.py (a <run>.<ll|hl>.json each; logs/index.json for the dropdown).
   No dependencies: vanilla JS + SVG, offline, zero build. */
const NS = "http://www.w3.org/2000/svg";
const KT = 1852 / 3600;                  // m/s per knot (display only)
const COLOR = { ll: "#0b7a6f", hl: "#c2600a" };
const PRESSURE = { rest: "rest", steady: "steady", fast: "fast", spoude: "spoude" };
const $ = id => document.getElementById(id);

const S = {                       // state
  runs: [],                       // index.json entries
  logs: { ll: null, hl: null },   // loaded log payloads
  t: 0, playing: false, speed: 1, lastFrame: 0,
  view: null,                     // {w,h,k,cx,cy,x0,y0,step}
  tEnd: 0, iDone: { ll: -1, hl: -1 },  // last trace-sample index per sim
};

/* ---------- loading ---------- */
async function loadIndex() {
  const r = await fetch("logs/index.json");
  S.runs = await r.json();
  const sel = $("run");
  for (const run of S.runs) {
    const opt = document.createElement("option");
    opt.value = run.id; opt.textContent = run.label;
    sel.appendChild(opt);
  }
  sel.onchange = () => loadRun(sel.value);
  await loadRun(S.runs[0].id);
}

async function loadRun(id) {
  const entry = S.runs.find(r => r.id === id);
  S.note = entry.note || "";
  S.logs = { ll: null, hl: null };
  await Promise.all(entry.sims.map(async sim => {
    const r = await fetch(`logs/${id}.${sim}.json`);
    if (r.ok) S.logs[sim] = await r.json();
  }));
  const both = entry.sims.length === 2;
  $("cmplbl").style.display = both ? "" : "none";
  $("compare").checked = both;
  rebuild();
}

/* ---------- layout ---------- */
function rebuild() {
  const logs = S.logs;
  S.tEnd = Math.max(...Object.values(logs).filter(Boolean).map(l => l.rows.at(-1).t));
  const pts = Object.values(logs).filter(Boolean).flatMap(l => l.rows);
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const dx = Math.max(x1 - x0, 1), dy = Math.max(y1 - y0, 1);
  x0 -= dx * .06; x1 += dx * .06; y0 -= dy * .06; y1 += dy * .06;
  const w = $("map").clientWidth || 800, h = $("map").clientHeight || 500;
  const k = Math.min(w / (x1 - x0), h / (y1 - y0));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  S.view = { w, h, k, cx, cy, step: niceStep(Math.max(x1 - x0, y1 - y0) / 8) };

  const svg = $("map");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.replaceChildren();
  drawGrid(svg);
  for (const sim of ["ll", "hl"]) if (logs[sim]) {
    drawTrace(svg, sim);
    drawShip(svg, sim);
  }
  buildCommands();
  paintMeta();
  S.iDone = { ll: -1, hl: -1 };
  seek(0, true);
  paintReadoutsBox();
}

function sx(x) { const v = S.view; return v.w / 2 + (x - v.cx) * v.k; }
function sy(y) { const v = S.view; return v.h / 2 - (y - v.cy) * v.k; }
const pt = p => `${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`;

function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw));
  for (const m of [1, 2, 5, 10]) if (raw <= m * p) return m * p;
  return 10 * p;
}

function drawGrid(svg) {
  const { step } = S.view;
  const g = document.createElementNS(NS, "g");
  for (let x = Math.floor((S.view.cx - S.view.w / 2 / S.view.k) / step) * step;
       x <= S.view.cx + S.view.w / 2 / S.view.k; x += step) {
    line(g, x, S.view.cx - S.view.w / 2 / S.view.k, x, S.view.cx + S.view.w / 2 / S.view.k, "gridline");
    label(g, sx(x) + 4, sy(S.view.cy + S.view.h / 2 / S.view.k) - 4,
          step >= 1000 ? `${(x / 1000).toFixed(1)} km` : `${Math.round(x)} m`);
  }
  for (let y = Math.floor((S.view.cy - S.view.h / 2 / S.view.k) / step) * step;
       y <= S.view.cy + S.view.h / 2 / S.view.k; y += step) {
    line(g, S.view.cx - S.view.w / 2 / S.view.k, y, S.view.cx + S.view.w / 2 / S.view.k, y, "gridline");
    label(g, sx(S.view.cx - S.view.w / 2 / S.view.k) + 4, sy(y) - 4,
          step >= 1000 ? `${(y / 1000).toFixed(1)} km` : `${Math.round(y)} m`);
  }
  svg.appendChild(g);
}

function line(g, x1, y1, x2, y2, cls) {
  const l = document.createElementNS(NS, "line");
  l.setAttribute("class", cls);
  l.setAttribute("x1", sx(x1)); l.setAttribute("y1", sy(y1));
  l.setAttribute("x2", sx(x2)); l.setAttribute("y2", sy(y2));
  g.appendChild(l);
}

function label(g, x, y, text) {
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.textContent = text;
  g.appendChild(t);
}

/* ---------- traces + ships ---------- */
function drawTrace(svg, sim) {
  const g = document.createElementNS(NS, "g");
  for (const cls of ["todo", "done"]) {
    const pl = document.createElementNS(NS, "polyline");
    pl.setAttribute("class", `trace ${cls} ${sim}`);
    pl.setAttribute("points", "");
    g.appendChild(pl);
  }
  svg.appendChild(g);
  const todo = g.children[0], done = g.children[1];
  todo.setAttribute("points", S.logs[sim].rows.map(pt).join(" "));
  g._done = done; g._rows = S.logs[sim].rows;
  svg._traces = svg._traces || {}; svg._traces[sim] = g;
}

function hullPts() {
  return [[27, 0], [17, 2.6], [-8, 2.6], [-20, 3.4], [-23, 1.6],
          [-23, -1.6], [-20, -3.4], [-8, -2.6], [17, -2.6]];
}

function drawShip(svg, sim) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", `ship ${sim}`);
  const poly = document.createElementNS(NS, "polygon");
  poly.setAttribute("class", "hull");
  poly.setAttribute("points", hullPts().map(p => p.join(",")).join(" "));
  g.appendChild(poly);
  svg._oars = svg._oars || {}; svg._steer = svg._steer || {};
  svg._oars[sim] = [];
  for (const side of [1, -1])          // 1 = starboard (+y local), -1 = port
    for (let b = 0; b < 3; b++)
      for (const x of [2, -4, -10, -16]) {
        const y0 = side * (3.3 + b * 1.7);
        const og = document.createElementNS(NS, "g");   // pivots at the gunwale
        og.setAttribute("class", "oar");
        og.setAttribute("transform", `translate(${x} ${y0})`);
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("class", "oar-line");
        ln.setAttribute("x1", 0); ln.setAttribute("y1", 0);
        ln.setAttribute("x2", 0); ln.setAttribute("y2", side * 4.8);
        og.appendChild(ln);
        g.appendChild(og);
        svg._oars[sim].push({ el: og, line: ln, side, x, y0, color: null });
      }
  const stg = document.createElementNS(NS, "g");   // steering oar, pivots at the stern
  stg.setAttribute("class", "steer");
  stg.setAttribute("transform", "translate(-23 0)");
  const st = document.createElementNS(NS, "line");
  st.setAttribute("class", "steer-line");
  st.setAttribute("x1", 0); st.setAttribute("y1", 0);
  st.setAttribute("x2", -11); st.setAttribute("y2", 3);
  stg.appendChild(st);
  g.appendChild(stg);
  svg._steer[sim] = stg;
  svg.appendChild(g);
  svg._ships = svg._ships || {}; svg._ships[sim] = g;
}

/* -------- orders on the ship icon --------
   oar angle = oar state: row sweeps at the stroke rate; hold = blades
   perpendicular; back = blades forward; bank = raised (short).
   oar colour = pressure level: rest grey, steady green, fast amber,
   spoude red (numeric 0-1 interpolates grey->red).
   the stern (steering) oar deflects with the helm order. */
const PRESSURE_COLOR = { rest: "#9e9e9e", steady: "#43a047", fast: "#f9a825", spoude: "#e53935" };

function pressureColor(p) {
  if (PRESSURE_COLOR[p]) return PRESSURE_COLOR[p];
  const f = Math.max(0, Math.min(1, Number(p) || 0));   // numeric pressure
  const a = [0x9e, 0x9e, 0x9e], b = [0xe5, 0x39, 0x35];
  return "#" + a.map((v, i) =>
    Math.round(v + (b[i] - v) * f).toString(16).padStart(2, "0")).join("");
}

function oarPose(state, t, rate) {      // [angle deg, scale] (shared sign)
  if (state === "hold") return [0, 1];
  if (state === "back") return [-38, 1];
  if (state === "bank") return [180, 0.55];
  const T = 60 / Math.max(rate, 1e-3);  // row: sweep catch -> finish -> catch
  const p = (t / T) % 1, D = 0.35;       // drive is ~35% of the cycle
  return [p < D ? -35 + 65 * (p / D) : 30 - 65 * ((p - D) / (1 - D)), 1];
}

function updateShipOrders(sim, crew, helm, t, rate) {
  const svg = $("map");
  const oars = svg._oars[sim];
  if (!oars) return;
  for (const o of oars) {
    const c = crew[o.side === 1 ? "star" : "port"];
    const [a, s] = oarPose(c.state, t, rate);
    o.el.setAttribute("transform",
      `translate(${o.x} ${o.y0}) rotate(${(o.side * a).toFixed(1)}) scale(${s})`);
    const col = pressureColor(c.pressure);
    if (col !== o.color) { o.line.setAttribute("stroke", col); o.color = col; }
  }
  const [dir, frac] = helm;
  const sign = dir === "port" ? 1 : dir === "starboard" ? -1 : 0;
  svg._steer[sim].setAttribute("transform",
    `translate(-23 0) rotate(${(sign * frac * 32).toFixed(1)})`);
}

/* ---------- the command strip ---------- */
function buildCommands() {
  const l = S.logs.ll || S.logs.hl;
  const strip = $("cmdstrip");
  strip.replaceChildren();
  strip._cmds = [];
  for (const c of l.commands) {
    const d = document.createElement("div");
    d.setAttribute("class", "cmd");
    d.style.left = `${(c.time / S.tEnd) * 100}%`;
    d.title = `t=${Math.round(c.time)} s — ${c.verb} ${c.args.join(" ")}`;
    d.onclick = () => seek(c.time, true);
    strip._cmds.push(d);
    strip.appendChild(d);
  }
  const cur = document.createElement("div");
  cur.setAttribute("class", "cursor");
  strip.appendChild(cur);
  $("cmdbar").title = "click a marker to jump to that command";
}

function updateStrip() {
  const strip = $("cmdstrip");
  strip.querySelector(".cursor").style.left = `${(S.t / S.tEnd) * 100}%`;
  let active = -1;
  for (let i = 0; i < strip._cmds.length; i++)
    if ((S.logs.ll || S.logs.hl).commands[i].time <= S.t + 1e-9) active = i;
  strip._cmds.forEach((el, i) => el.classList.toggle("active", i === active));
}

/* ---------- playback ---------- */
function seek(t, scrub) {
  S.t = Math.max(0, Math.min(t, S.tEnd));
  const scr = $("scrub");
  if (scr) scr.value = S.t;
  render();
  if (!scrub && S.playing && S.t >= S.tEnd) pause();
  $("clock").textContent = `${fmt(S.t)} / ${fmt(S.tEnd)}`;
}

function render() {
  const svg = $("map");
  for (const sim of ["ll", "hl"]) {
    const l = S.logs[sim];
    if (!l) continue;
    const p = pose(l.rows, S.t);
    const ship = svg._ships[sim];
    ship.setAttribute("transform",
      `translate(${sx(p.x).toFixed(1)} ${sy(p.y).toFixed(1)}) rotate(${(-p.psi * 180 / Math.PI).toFixed(1)}) scale(1.05)`);
    updateShipOrders(sim, p.crew, p.helm, S.t, p.rate);
    const i = Math.min(l.rows.length - 1, Math.max(0, Math.floor(S.t)));
    if (i !== S.iDone[sim]) {           // redraw the laid path once per second
      S.iDone[sim] = i;
      svg._traces[sim]._done.setAttribute("points",
        l.rows.slice(0, i + 1).map(pt).join(" "));
      paintReadouts(sim, p, i);
    }
  }
  updateStrip();   // the cursor and active command track every frame
}

function pose(rows, t) {
  const i = Math.min(rows.length - 1, Math.max(0, Math.floor(t)));
  const a = rows[i], b = rows[Math.min(i + 1, rows.length - 1)];
  const f = b === a ? 0 : (t - a.t) / (b.t - a.t);
  const dPsi = b.psi - a.psi;
  return {
    x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f,
    psi: a.psi + (dPsi - 2 * Math.PI * Math.round(dPsi / (2 * Math.PI))) * f,
    V: a.V + (b.V - a.V) * f, omega: a.omega + (b.omega - a.omega) * f,
    rate: a.rate, crew: a.crew, helm: a.helm,
  };
}

function paintReadouts(sim, p, i) {
  const l = S.logs[sim];
  const el = $(`ro-${sim}`);
  if (!el) return;
  el.innerHTML = "";
  el.appendChild(h(`<h3>${l.meta.sim_label}</h3>
    <table>
      <tr><td>speed</td><td class="big">${(p.V / KT).toFixed(2)} kt</td></tr>
      <tr><td>rate</td><td>${p.rate.toFixed(1)} spm</td></tr>
      <tr><td>heading</td><td>${(headingDeg(l, i == null ? Math.floor(S.t) : i) + 360) % 360 | 0}°</td></tr>
      <tr><td>yaw rate</td><td>${(p.omega * 180 / Math.PI).toFixed(1)}°/s</td></tr>
      <tr><td>helm</td><td>${helmText(p.helm)}</td></tr>
    </table>`));
  for (const side of ["port", "star"]) {
    const c = p.crew[side];
    const limited = c.limited && c.limited !== "parked"
      ? ` <span class="tag">[${c.limited}]</span>` : "";
    el.appendChild(h(`<table>
      <tr><td>${side}</td><td>${c.state} · ${PRESSURE[c.pressure] || c.pressure}${limited}</td></tr>
      <tr><td>W′</td><td><div class="wbar"><i style="width:${(100 * c.W_frac).toFixed(0)}%"></i></div></td></tr>
    </table>`));
  }
}

function headingDeg(l, i) {              // unwrapped cumulative heading, in rad
  if (!l._cum) {
    let acc = 0; l._cum = [0];
    for (let k = 1; k < l.rows.length; k++) {
      let d = l.rows[k].psi - l.rows[k - 1].psi;
      d -= 2 * Math.PI * Math.round(d / (2 * Math.PI));
      acc += d; l._cum.push(acc);
    }
  }
  return l._cum[Math.min(l.rows.length - 1, Math.max(0, Math.floor(i)))];
}

function helmText(helm) {
  const [dir, frac] = helm;
  return dir === "midship" ? "midship" : `${dir} ${(100 * frac) | 0}%`;
}

const h = html => { const d = document.createElement("div"); d.innerHTML = html; return d; };
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function paintMeta() {
  const l = S.logs.ll || S.logs.hl;
  $("meta").textContent =
    `${l.meta.label} · ${Object.values(S.logs).filter(Boolean).map(x => x.meta.sim_label).join(" + ")}` +
    ` · calibration ${l.meta.calibration} · dt ${l.meta.dt} s · ${fmt(S.tEnd)}` +
    (S.note ? ` · ⚠ ${S.note}` : "");
}

function showSim(sim, on) {
  const svg = $("map");
  if (svg._ships && svg._ships[sim]) svg._ships[sim].style.display = on ? "" : "none";
  if (svg._traces && svg._traces[sim]) svg._traces[sim].style.display = on ? "" : "none";
}

function paintReadoutsBox() {
  const box = $("readouts");
  box.replaceChildren();
  for (const sim of ["ll", "hl"]) {
    const on = S.logs[sim] && (sim === "ll" || $("compare").checked || !S.logs.ll);
    if (S.logs[sim]) showSim(sim, on);
    if (on) box.appendChild(h(`<div class="sim ${sim}" id="ro-${sim}"></div>`));
  }
  for (const sim of ["ll", "hl"])
    if ($(`ro-${sim}`)) paintReadouts(sim, pose(S.logs[sim].rows, S.t));
}

/* ---------- controls ---------- */
function play() {
  S.playing = true; S.lastFrame = 0;
  $("play").textContent = "❚❚";
  requestAnimationFrame(frame);
}
function pause() {
  S.playing = false;
  $("play").textContent = "▶";
}
function frame(ts) {
  if (!S.playing) return;
  const dt = S.lastFrame ? (ts - S.lastFrame) / 1000 : 0;
  S.lastFrame = ts;
  if (S.t >= S.tEnd) { pause(); return; }
  seek(S.t + dt * S.speed);
  requestAnimationFrame(frame);
}

$("play").onclick = () => S.playing ? pause() : play();
$("speed").onchange = e => S.speed = parseFloat(e.target.value);
$("compare").onchange = () => { paintReadoutsBox(); };
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !/INPUT|SELECT|BUTTON/.test(e.target.tagName)) {
    e.preventDefault(); S.playing ? pause() : play();
  }
});
let rszTimer;
window.addEventListener("resize", () => { clearTimeout(rszTimer); rszTimer = setTimeout(rebuild, 200); });

/* scrubber (built once per rebuild) */
function buildScrub() {
  const old = $("scrub");
  if (old) old.remove();
  const s = document.createElement("input");
  s.id = "scrub"; s.type = "range"; s.min = 0; s.max = S.tEnd; s.step = 0.1;
  s.style.width = "100%";
  s.oninput = e => { S.playing = false; $("play").textContent = "▶"; seek(parseFloat(e.target.value), true); };
  $("cmdstrip").insertAdjacentElement("beforebegin", s);
  $("cmdbar").title = "";
}

/* hook: rebuild the scrubber alongside the command strip */
const _rebuild = rebuild;
rebuild = function () { _rebuild(); buildScrub(); };

loadIndex();
</script>
</body>
</html>
