[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".venv", ".git", "__pycache__", "research/sources/galley-sizing-xlsm/extracted", "research/sources/warship-evolution-6th-bc/extracted"]

[tool.ruff.lint]
# Initial minimal-change config: ignore all currently failing codes so `ruff check` is green.
# Will be reduced to [] in follow-up commits.
ignore = [
    "C408",     # unnecessary-collection-call
    "I001",     # unsorted-imports
    "F401",     # unused-import
    "F841",     # unused-variable
    "RUF059",   # unused-unpacked-variable
    "SIM115",   # open-file-with-context-handler
    "FURB167",  # regex-flag-alias
    "BLE001",   # blind-except
    "RUF015",   # unnecessary-iterable-allocation-for-first-element
    "RUF100",   # unused-noqa
    "F821",     # undefined-name
    "F541",     # f-string-missing-placeholders
    "UP031",    # printf-string-formatting
    "PLW1510",  # subprocess-run-without-check
    "RUF007",   # zip-instead-of-pairwise
    "DTZ011",   # call-date-today
    "C401",     # unnecessary-generator-set
    "PLC0206",  # dict-index-missing-items
    "PLW0602",  # global-variable-not-assigned
    "ISC004",   # implicit-string-concatenation-in-collection-literal
    "PERF102",  # incorrect-dict-iterator
    "PLR0402",  # manual-from-import
    "PIE810",   # multiple-starts-ends-with
    "RUF046",   # unnecessary-cast-to-int
]
